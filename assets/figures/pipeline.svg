<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 380" width="1240" height="380" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>CrowdSense inference pipeline</title>
  <desc>An RGB frame is resized, passed through a VGG-19 backbone, a four-layer transformer encoder with global and learnable local attention, and a convolutional regression head. The resulting density map is summed to give the count and color-mapped onto the frame as a heatmap overlay.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4b6475"/>
    </marker>
  </defs>

  <rect width="1240" height="380" fill="#ffffff"/>

  <!-- stage labels -->
  <g font-size="13" font-weight="600" letter-spacing="1.6" fill="#2b7a7f">
    <text x="20" y="40">INPUT</text>
    <text x="214" y="40">FEATURES</text>
    <text x="408" y="40">MULTIFACETED ATTENTION</text>
    <text x="700" y="40">REGRESSION</text>
    <text x="894" y="40">OUTPUTS</text>
  </g>

  <!-- boxes -->
  <g stroke="#c9d5d9" stroke-width="1.5" fill="#f4f7f6">
    <rect x="20" y="70" width="160" height="150" rx="10"/>
    <rect x="214" y="70" width="160" height="150" rx="10"/>
    <rect x="408" y="70" width="258" height="150" rx="10" fill="#e8f1f0" stroke="#2b7a7f"/>
    <rect x="700" y="70" width="160" height="150" rx="10"/>
    <rect x="894" y="70" width="150" height="150" rx="10" fill="#fdf1ea" stroke="#e09675"/>
  </g>

  <!-- input -->
  <text x="100" y="118" text-anchor="middle" font-size="19" font-weight="600" fill="#192e3f">RGB frame</text>
  <text x="100" y="146" text-anchor="middle" font-size="14" fill="#4b6475">resized so the</text>
  <text x="100" y="166" text-anchor="middle" font-size="14" fill="#4b6475">short side is 512 px</text>
  <text x="100" y="186" text-anchor="middle" font-size="14" fill="#4b6475">(long side ≤ 2048)</text>

  <!-- backbone -->
  <text x="294" y="118" text-anchor="middle" font-size="19" font-weight="600" fill="#192e3f">VGG-19</text>
  <text x="294" y="146" text-anchor="middle" font-size="14" fill="#4b6475">ImageNet-pretrained</text>
  <text x="294" y="166" text-anchor="middle" font-size="14" fill="#4b6475">512 channels</text>
  <text x="294" y="186" text-anchor="middle" font-size="14" fill="#4b6475">at 1/32 resolution</text>

  <!-- transformer -->
  <text x="537" y="112" text-anchor="middle" font-size="19" font-weight="600" fill="#192e3f">Transformer encoder × 4</text>
  <text x="537" y="140" text-anchor="middle" font-size="14" fill="#4b6475">d = 512 · 2 heads · FFN 2048</text>
  <text x="537" y="166" text-anchor="middle" font-size="14" fill="#192e3f">0.1 · global attention</text>
  <text x="537" y="186" text-anchor="middle" font-size="14" fill="#192e3f">+ learnable region attention (LRA)</text>

  <!-- regression head -->
  <text x="780" y="118" text-anchor="middle" font-size="19" font-weight="600" fill="#192e3f">Conv head</text>
  <text x="780" y="146" text-anchor="middle" font-size="14" fill="#4b6475">upsample to 1/16</text>
  <text x="780" y="166" text-anchor="middle" font-size="14" fill="#4b6475">3×3 conv 256 → 128</text>
  <text x="780" y="186" text-anchor="middle" font-size="14" fill="#4b6475">1×1 conv → ReLU</text>

  <!-- density map -->
  <text x="969" y="118" text-anchor="middle" font-size="19" font-weight="600" fill="#192e3f">Density map D</text>
  <g transform="translate(921 136)">
    <rect width="96" height="58" rx="4" fill="#0b1f8f"/>
    <circle cx="30" cy="34" r="14" fill="#2f6bff"/>
    <circle cx="30" cy="34" r="8" fill="#ffd23f"/>
    <circle cx="30" cy="34" r="4" fill="#e3361b"/>
    <circle cx="62" cy="26" r="11" fill="#2f6bff"/>
    <circle cx="62" cy="26" r="5" fill="#6be3c9"/>
    <circle cx="80" cy="44" r="7" fill="#2f6bff"/>
  </g>

  <!-- arrows between stages -->
  <g stroke="#4b6475" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M180 145H210"/>
    <path d="M374 145H404"/>
    <path d="M666 145H696"/>
    <path d="M860 145H890"/>
    <path d="M1044 108H1080"/>
    <path d="M1044 182H1080"/>
  </g>

  <!-- outputs -->
  <g stroke="#c9d5d9" stroke-width="1.5" fill="#f4f7f6">
    <rect x="1084" y="76" width="140" height="64" rx="10"/>
    <rect x="1084" y="150" width="140" height="64" rx="10"/>
  </g>
  <text x="1154" y="104" text-anchor="middle" font-size="17" font-weight="600" fill="#192e3f">Count = ΣD</text>
  <text x="1154" y="126" text-anchor="middle" font-size="13" fill="#4b6475">people in frame</text>
  <text x="1154" y="178" text-anchor="middle" font-size="17" font-weight="600" fill="#192e3f">Heatmap</text>
  <text x="1154" y="200" text-anchor="middle" font-size="13" fill="#4b6475">overlaid on frame</text>

  <!-- training-only note under the attention block -->
  <rect x="408" y="252" width="258" height="92" rx="10" fill="none" stroke="#2b7a7f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M537 222V248" stroke="#2b7a7f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="537" y="277" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.4" fill="#2b7a7f">TRAINING ONLY</text>
  <text x="537" y="302" text-anchor="middle" font-size="14" fill="#192e3f">Local Attention Regularization</text>
  <text x="537" y="324" text-anchor="middle" font-size="14" fill="#192e3f">+ Instance Attention loss</text>

  <text x="20" y="368" font-size="13" fill="#4b6475">Architecture: Multifaceted Attention Network (MAN), Lin et al., CVPR 2022. CrowdSense fine-tunes it on Arab-context crowd scenes and serves it through FastAPI.</text>
</svg>
